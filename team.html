<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="마이에듀케이션 팀원 소개">
    <title>팀원 소개 | 마이에듀케이션</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="team.css">
    <script src="team.js" defer></script>
</head>
<body class="team-page">
    <header class="team-header">
        <div class="container team-header-inner">
            <a class="logo" href="index.html" aria-label="마이에듀케이션 홈페이지로 이동">
                <img class="header-logo-image" src="images/logo-hd.png" alt="(주)마이에듀케이션">
            </a>
            <a class="team-back" href="index.html#about"><span aria-hidden="true">←</span> 조직도로 돌아가기</a>
        </div>
    </header>

    <main class="team-main">
        <section class="team-profile" aria-labelledby="profile-name">
            <div class="team-profile-bg" aria-hidden="true">MY</div>
            <div class="container team-profile-grid">
                <div class="team-profile-visual">
                    <div class="team-profile-avatar">
                        <img id="profile-photo" src="" alt="" hidden>
                        <span id="profile-initial" aria-hidden="true">이</span>
                    </div>
                    <span class="team-profile-tag">MY EDUCATION TEAM</span>
                </div>

                <div class="team-profile-content">
                    <p class="section-label"><span>TEAM</span> PEOPLE</p>
                    <p class="team-profile-role" id="profile-role">대표</p>
                    <h1 id="profile-name">이희연</h1>
                    <p class="team-profile-lead">교육의 가치를 함께 설계하고,<br>좋은 경험으로 완성합니다.</p>
                    <p class="team-profile-description" id="profile-description">마이에듀케이션과 함께 교육의 본질을 고민하고 더 나은 배움의 경험을 만들어갑니다.</p>

                    <div class="team-profile-note">
                        <span>PROFILE</span>
                        <ul id="profile-careers" class="team-profile-careers">
                            <li>상세 담당 업무와 주요 프로젝트 이력은 업데이트 예정입니다.</li>
                        </ul>
                    </div>

                    <div class="team-profile-actions">
                        <a class="button button-primary" href="index.html#contact">프로젝트 문의하기 <span aria-hidden="true">→</span></a>
                        <a class="button button-secondary" href="index.html#about">다른 팀원 보기</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
